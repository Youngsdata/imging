<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>imging.cn · 访问监控登录</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-observer" aria-hidden="true">
      <div class="observer-grid"></div>
      <div class="observer-orbit orbit-one"></div>
      <div class="observer-orbit orbit-two"></div>
      <div class="observer-core"><span></span></div>
      <div class="observer-scan"></div>
      <p>PRIVATE OBSERVATORY</p>
    </section>
    <section class="login-panel" aria-labelledby="login-title">
      <div class="brand"><span class="brand-mark">映</span><span>imging.cn</span></div>
      <p class="eyebrow">访问监控 · 安全入口</p>
      <h1 id="login-title">验证后进入观测台</h1>
      <p class="login-copy">此页面包含真实访问 IP 与地域数据。登录需要管理密码和动态验证码。</p>
      {% if error %}<div class="form-error" role="alert">{{ error }}</div>{% endif %}
      <form method="post" action="/login" class="login-form" autocomplete="on">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <label><span>账号</span><input name="username" value="{{ username }}" maxlength="64" autocomplete="username" required autofocus></label>
        <label><span>密码</span><input type="password" name="password" maxlength="1024" autocomplete="current-password" required></label>
        <label><span>动态验证码或恢复码</span><input name="otp" maxlength="64" inputmode="numeric" autocomplete="one-time-code" required></label>
        <button type="submit">验证并进入</button>
      </form>
      <p class="login-footnote">会话闲置 30 分钟后自动失效。连续失败将触发限流和指数退避。</p>
    </section>
  </main>
</body>
</html>
