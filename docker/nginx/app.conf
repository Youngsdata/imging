root /usr/share/nginx/html;
index index.html;

server_tokens off;

# AVIF 与本地 AI 的多线程 WASM 依赖 cross-origin isolation。
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Content-Type-Options "nosniff" always;

# 镜像体积优先，不额外存放预压缩副本；首次请求动态压缩，后续由浏览器长缓存命中。
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 3;
gzip_types application/javascript application/wasm;

# ES module 和 WASM 必须使用正确 MIME，否则浏览器会拒绝加载或流式编译。
location ~* \.mjs$ {
    default_type application/javascript;
    try_files $uri =404;
    expires 1y;
}

location ~* \.wasm$ {
    default_type application/wasm;
    try_files $uri =404;
    expires 1y;
}

location /codecs/ {
    try_files $uri =404;
    expires 1y;
}

location = /ai/background-removal.js {
    try_files $uri =404;
    expires -1;
}

location /ai/ {
    try_files $uri =404;
    expires 1y;
}

location /models/ {
    default_type application/octet-stream;
    try_files $uri =404;
    expires 1y;
}

location = /index.html {
    try_files $uri =404;
    expires -1;
}

location / {
    try_files $uri $uri/ =404;
}
