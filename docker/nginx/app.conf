root /usr/share/nginx/html;
index index.html;
absolute_redirect off;

# 主镜像是访问统计的唯一默认数据源；前置代理日志仅作为可选适配器。
include /etc/nginx/snippets/imging-real-ip.conf;
access_log /var/log/imging/access.json imging_json buffer=64k flush=1s;

server_tokens off;

# nginx 默认只给 text/html 带字符集；llms.txt、robots.txt 等纯文本不带 charset 时
# 中文环境的浏览器会猜成 GBK 而显示乱码。全站统一声明 UTF-8。
charset utf-8;
charset_types text/plain text/xml text/markdown text/css application/xml application/json application/rss+xml image/svg+xml;

# 生产官网只保留一个主机名；自托管的其他 Host 不受影响。
if ($host = www.imging.cn) {
    return 301 https://imging.cn$request_uri;
}

if ($imging_malicious_request) {
    return 493;
}

# AVIF 与本地 AI 的多线程 WASM 依赖 cross-origin isolation。
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Content-Type-Options "nosniff" always;
# 同时覆盖容器直连 HTTPS 与外层 TLS 代理；浏览器会忽略纯 HTTP 响应里的 HSTS。
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# /img 与 /video 只负责直接启动工具；完整内容由对应任务页承接索引与 AI 引用。
add_header X-Robots-Tag $imging_shortcut_robots always;
add_header Link $imging_shortcut_canonical always;

# 不额外存放预压缩副本；首次请求动态压缩，后续由浏览器长缓存命中。
# level 6 是实测拐点：dist/index.html 在 3/6/9 下分别是 225,635 / 206,470 / 205,785 字节，
# 3→6 每次导航省 8.5%，6→9 几乎无额外收益。HTML 走 no-cache，这 8.5% 每次访问都拿得到。
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_types text/css text/plain text/markdown application/javascript application/wasm application/xml application/json image/svg+xml;

# ES module 和 WASM 必须使用正确 MIME，否则浏览器会拒绝加载或流式编译。
location ~* \.mjs$ {
    default_type application/javascript;
    try_files $uri =404;
    expires 1y;
}

location ~* \.wasm$ {
    default_type application/wasm;
    try_files $uri =404;
    expires 1y;
}

location /codecs/ {
    try_files $uri =404;
    expires 1y;
}

location = /ai/background-removal.js {
    try_files $uri =404;
    expires -1;
}

location /ai/ {
    try_files $uri =404;
    expires 1y;
}

location /models/ {
    default_type application/octet-stream;
    try_files $uri =404;
    expires 1y;
}

# 双语、无尾斜杠的工具快捷入口。尾斜杠统一跳转，避免相对资源基址改变。
location = /img/ { return 308 /img$is_args$args; }
location = /video/ { return 308 /video$is_args$args; }
location = /pdf/ { return 308 /pdf$is_args$args; }
location = /pdf-html/ { return 308 /pdf-html$is_args$args; }
location = /html-pdf/ { return 308 /html-pdf$is_args$args; }
location = /en/img/ { return 308 /en/img$is_args$args; }
location = /en/video/ { return 308 /en/video$is_args$args; }
location = /en/pdf/ { return 308 /en/pdf$is_args$args; }
location = /en/pdf-html/ { return 308 /en/pdf-html$is_args$args; }
location = /en/html-pdf/ { return 308 /en/html-pdf$is_args$args; }

location = /img {
    try_files /index.html =404;
    expires -1;
}

location = /video {
    try_files /index.html =404;
    expires -1;
}

location = /en/img {
    try_files /en/index.html =404;
    expires -1;
}

location = /en/video {
    try_files /en/index.html =404;
    expires -1;
}

location = /pdf {
    try_files /index.html =404;
    expires -1;
}

location = /pdf-html {
    try_files /index.html =404;
    expires -1;
}

location = /html-pdf {
    try_files /index.html =404;
    expires -1;
}

# HTML 页面只在用户明确点击转换后提交到同容器 Chromium；返回真实 PDF 字节，
# 不经过浏览器打印对话框。请求体、并发、超时和临时文件生命周期由服务端再次限制。
location = /api/html-to-pdf {
    client_max_body_size 64m;
    proxy_connect_timeout 3s;
    proxy_read_timeout 100s;
    proxy_send_timeout 100s;
    proxy_request_buffering on;
    proxy_buffering off;
    proxy_set_header Content-Type $content_type;
    proxy_set_header Content-Length $content_length;
    proxy_pass http://127.0.0.1:8091;
}

location = /en/pdf {
    try_files /en/index.html =404;
    expires -1;
}

location = /en/pdf-html {
    try_files /en/index.html =404;
    expires -1;
}

location = /en/html-pdf {
    try_files /en/index.html =404;
    expires -1;
}

location /video/ {
    try_files $uri =404;
    expires 1y;
}

location /pdf/ {
    try_files $uri =404;
    expires 1y;
}

location /fonts/ {
    try_files $uri =404;
    expires 1y;
}

location = /index.html {
    if ($request_uri ~ "^/index\\.html(?:\\?.*)?$") {
        return 301 /;
    }
    try_files $uri =404;
    expires -1;
}

# 兼容英文路径迁移前的入口，避免旧书签和历史链接返回 404。
location = /图映.html {
    return 301 /;
}

# 同一份内容目前有三个可达地址（带尾斜杠、不带、以及 /index.html），而 canonical 只指向带尾斜杠版。
# 站点已经为 /img /video /pdf 认真写了 308，这里把任务页和目录页也一并归一化。
location ~ ^(/.+)/index\.html$ {
    if ($request_uri ~ "^(/.+)/index\\.html(?:\\?.*)?$") {
        return 301 $1/;
    }
    try_files $uri =404;
    expires -1;
}

location ~* \.html$ {
    try_files $uri =404;
    expires -1;
}

location /assets/ {
    try_files $uri =404;
    expires 7d;
}

location = /robots.txt { try_files $uri =404; expires -1; }
location = /sitemap.xml { try_files $uri =404; expires -1; }
location = /llms.txt { try_files $uri =404; expires -1; }

# 无尾斜杠的目录地址补上斜杠；/img /video /pdf 是刻意的无斜杠快捷入口，已由上面的精确匹配接管。
location ~ ^(/(?:en/)?[a-z][a-z0-9-]+)$ {
    if (-d $document_root$1) { return 301 $1/; }
    try_files $uri $uri/index.html =404;
}

location / {
    try_files $uri $uri/ $uri/index.html =404;
}
