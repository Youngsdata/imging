root /usr/share/nginx/html;
index index.html;
absolute_redirect off;

server_tokens off;

# 生产官网只保留一个主机名；自托管的其他 Host 不受影响。
if ($host = www.imging.cn) {
    return 301 https://imging.cn$request_uri;
}

# AVIF 与本地 AI 的多线程 WASM 依赖 cross-origin isolation。
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Content-Type-Options "nosniff" always;
# 同时覆盖容器直连 HTTPS 与外层 TLS 代理；浏览器会忽略纯 HTTP 响应里的 HSTS。
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# 镜像体积优先，不额外存放预压缩副本；首次请求动态压缩，后续由浏览器长缓存命中。
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 3;
gzip_types text/css text/plain application/javascript application/wasm application/xml image/svg+xml;

# ES module 和 WASM 必须使用正确 MIME，否则浏览器会拒绝加载或流式编译。
location ~* \.mjs$ {
    default_type application/javascript;
    try_files $uri =404;
    expires 1y;
}

location ~* \.wasm$ {
    default_type application/wasm;
    try_files $uri =404;
    expires 1y;
}

location /codecs/ {
    try_files $uri =404;
    expires 1y;
}

location = /ai/background-removal.js {
    try_files $uri =404;
    expires -1;
}

location /ai/ {
    try_files $uri =404;
    expires 1y;
}

location /models/ {
    default_type application/octet-stream;
    try_files $uri =404;
    expires 1y;
}

location /video/ {
    try_files $uri =404;
    expires 1y;
}

location = /index.html {
    if ($request_uri ~ "^/index\\.html(?:\\?.*)?$") {
        return 301 /;
    }
    try_files $uri =404;
    expires -1;
}

# 兼容英文路径迁移前的入口，避免旧书签和历史链接返回 404。
location = /图映.html {
    return 301 /;
}

location ~* \.html$ {
    try_files $uri =404;
    expires -1;
}

location /assets/ {
    try_files $uri =404;
    expires 7d;
}

location = /robots.txt { try_files $uri =404; expires -1; }
location = /sitemap.xml { try_files $uri =404; expires -1; }
location = /llms.txt { try_files $uri =404; expires -1; }

location / {
    try_files $uri $uri/ $uri/index.html =404;
}
