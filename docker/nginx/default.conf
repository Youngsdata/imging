# 只按明确的敏感文件和漏洞探测路径拦截，不按国家、云厂商 IP 或爬虫身份封禁。
# 正常搜索与链接预览爬虫可以继续抓取公开页面，但 monitor 会把它们从访问统计中扣除。
map $uri $imging_malicious_request {
    default 0;
    ~*^/(?:@fs/|\.env(?:[./]|$)|\.git(?:/|$)|\.aws(?:/|$)|\.ssh(?:/|$)|\.docker(?:/|$)) 1;
    ~*^/(?:proc/self/environ|id_rsa(?:[./]|$)|serviceAccountKey\.json$|wp-config\.php|xmlrpc\.php$) 1;
    ~*^/(?:wp-admin(?:/|$)|wp-content(?:/|$)|wp-includes(?:/|$)|vendor/phpunit(?:/|$)|cgi-bin(?:/|$)) 1;
    ~*^/(?:phpinfo\.php$|server-status(?:/|$)|server-info(?:/|$)|actuator(?:/|$)) 1;
}

# 内容指纹入口与真正低频的大资源可以永久缓存；HTML 和 API 不在这里命中，
# 仍分别由页面 no-cache 与接口 no-store 保证立即更新。以后接入 EdgeOne 时
# 节点只需遵循源站 Cache-Control，即可复用同一套规则。
map $uri $imging_asset_cache_control {
    default "";
    ~*\.[0-9a-f]{12}\.(?:js|mjs|css)$ "public, max-age=31536000, immutable";
    ~^/codecs/ "public, max-age=31536000, immutable";
    ~^/models/ "public, max-age=31536000, immutable";
    ~^/fonts/ "public, max-age=31536000, immutable";
    ~^/templates/v1/ "public, max-age=31536000, immutable";
    ~^/ai/ort[^/]*$ "public, max-age=31536000, immutable";
    ~^/video/mediabunny-[^/]+\.min\.js$ "public, max-age=31536000, immutable";
    ~^/api/ "no-store";
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    include /etc/nginx/snippets/imging-app.conf;
}
