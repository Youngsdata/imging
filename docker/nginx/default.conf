log_format imging_json escape=json '{'
    '"@timestamp":"$time_iso8601",'
    '"clientip":"$remote_addr",'
    '"connectionip":"$realip_remote_addr",'
    '"status":"$status",'
    '"method":"$request_method",'
    '"host":"$host",'
    '"request_uri":"$request_uri",'
    '"body_bytes_sent":"$body_bytes_sent",'
    '"request_time":"$request_time",'
    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent"'
'}';

map $request_uri $imging_shortcut_robots {
    default "";
    ~^/(?:img|video|pdf|en/img|en/video|en/pdf)(?:\?.*)?$ "noindex, follow";
}

map $request_uri $imging_shortcut_canonical {
    default "";
    ~^/img(?:\?.*)?$ "<https://imging.cn/online-design/>; rel=\"canonical\"";
    ~^/video(?:\?.*)?$ "<https://imging.cn/video-editor/>; rel=\"canonical\"";
    ~^/pdf(?:\?.*)?$ "<https://imging.cn/pdf-compress/>; rel=\"canonical\"";
    ~^/en/img(?:\?.*)?$ "<https://imging.cn/en/online-design/>; rel=\"canonical\"";
    ~^/en/video(?:\?.*)?$ "<https://imging.cn/en/video-editor/>; rel=\"canonical\"";
    ~^/en/pdf(?:\?.*)?$ "<https://imging.cn/en/pdf-compress/>; rel=\"canonical\"";
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    include /etc/nginx/snippets/imging-app.conf;
}
