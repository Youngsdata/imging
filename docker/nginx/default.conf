log_format imging_json escape=json '{'
    '"@timestamp":"$time_iso8601",'
    '"clientip":"$remote_addr",'
    '"connectionip":"$realip_remote_addr",'
    '"status":"$status",'
    '"method":"$request_method",'
    '"host":"$host",'
    '"request_uri":"$request_uri",'
    '"body_bytes_sent":"$body_bytes_sent",'
    '"request_time":"$request_time",'
    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent"'
'}';

map $request_uri $imging_shortcut_robots {
    default "";
    ~^/(?:(?:en|ja|ko|de|es|pt|fr)/)?(?:img|video|pdf|pdf-html|html-pdf)(?:\?.*)?$ "noindex, follow";
}

map $request_uri $imging_shortcut_canonical {
    default "";
    ~^/img(?:\?.*)?$ "<https://imging.cn/online-design/>; rel=\"canonical\"";
    ~^/video(?:\?.*)?$ "<https://imging.cn/video-editor/>; rel=\"canonical\"";
    ~^/pdf(?:\?.*)?$ "<https://imging.cn/pdf-compress/>; rel=\"canonical\"";
    ~^/pdf-html(?:\?.*)?$ "<https://imging.cn/pdf-to-html/>; rel=\"canonical\"";
    ~^/html-pdf(?:\?.*)?$ "<https://imging.cn/html-to-pdf/>; rel=\"canonical\"";
    ~^/en/img(?:\?.*)?$ "<https://imging.cn/en/online-design/>; rel=\"canonical\"";
