log_format imging_json escape=json '{'
    '"@timestamp":"$time_iso8601",'
    '"clientip":"$remote_addr",'
    '"connectionip":"$realip_remote_addr",'
    '"status":"$status",'
    '"method":"$request_method",'
    '"host":"$host",'
    '"request_uri":"$request_uri",'
    '"body_bytes_sent":"$body_bytes_sent",'
    '"request_time":"$request_time",'
    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent"'
'}';

map $request_uri $imging_shortcut_robots {
    default "";
    ~^/(?:img|video|pdf|pdf-html|en/img|en/video|en/pdf|en/pdf-html)(?:\?.*)?$ "noindex, follow";
}

map $request_uri $imging_shortcut_canonical {
    default "";
    ~^/img(?:\?.*)?$ "<https://imging.cn/online-design/>; rel=\"canonical\"";
    ~^/video(?:\?.*)?$ "<https://imging.cn/video-editor/>; rel=\"canonical\"";
    ~^/pdf(?:\?.*)?$ "<https://imging.cn/pdf-compress/>; rel=\"canonical\"";
    ~^/pdf-html(?:\?.*)?$ "<https://imging.cn/pdf-to-html/>; rel=\"canonical\"";
    ~^/en/img(?:\?.*)?$ "<https://imging.cn/en/online-design/>; rel=\"canonical\"";
    ~^/en/video(?:\?.*)?$ "<https://imging.cn/en/video-editor/>; rel=\"canonical\"";
    ~^/en/pdf(?:\?.*)?$ "<https://imging.cn/en/pdf-compress/>; rel=\"canonical\"";
    ~^/en/pdf-html(?:\?.*)?$ "<https://imging.cn/en/pdf-to-html/>; rel=\"canonical\"";
}

# 只按明确的敏感文件和漏洞探测路径拦截，不按国家、云厂商 IP 或爬虫身份封禁。
# 正常搜索与链接预览爬虫可以继续抓取公开页面，但 monitor 会把它们从访问统计中扣除。
map $uri $imging_malicious_request {
    default 0;
    ~*^/(?:@fs/|\.env(?:[./]|$)|\.git(?:/|$)|\.aws(?:/|$)|\.ssh(?:/|$)|\.docker(?:/|$)) 1;
    ~*^/(?:proc/self/environ|id_rsa(?:[./]|$)|serviceAccountKey\.json$|wp-config\.php|xmlrpc\.php$) 1;
    ~*^/(?:wp-admin(?:/|$)|wp-content(?:/|$)|wp-includes(?:/|$)|vendor/phpunit(?:/|$)|cgi-bin(?:/|$)) 1;
    ~*^/(?:phpinfo\.php$|server-status(?:/|$)|server-info(?:/|$)|actuator(?:/|$)) 1;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    include /etc/nginx/snippets/imging-app.conf;
}
