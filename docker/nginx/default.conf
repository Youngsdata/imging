map $request_uri $imging_shortcut_robots {
    default "";
    ~^/(?:img|video|en/img|en/video)(?:\?.*)?$ "noindex, follow";
}

map $request_uri $imging_shortcut_canonical {
    default "";
    ~^/img(?:\?.*)?$ "<https://imging.cn/online-design/>; rel=\"canonical\"";
    ~^/video(?:\?.*)?$ "<https://imging.cn/video-editor/>; rel=\"canonical\"";
    ~^/en/img(?:\?.*)?$ "<https://imging.cn/en/online-design/>; rel=\"canonical\"";
    ~^/en/video(?:\?.*)?$ "<https://imging.cn/en/video-editor/>; rel=\"canonical\"";
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    include /etc/nginx/snippets/imging-app.conf;
}
